project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"          # .qmd only — a README.md will never become a page
  resources:
    - "assets/**"         # copies resume PDFs even when linked from raw HTML
  post-render:
    - scripts/ensure-nojekyll.R

website:
  title: "Jake Evans"
  description: "Digital marketer — CRM, analytics, SEO, and content."
  # favicon: assets/favicon.png   # uncomment once the file exists
  search: false           # a search box would let recruiters find other role pages
  # No Quarto navbar or page-footer: the site shell (nav + footer) lives in
  # _partials/ so every page, including role pages, shares one design.

format:
  html:
    theme:
      - cosmo
      - styles/theme.scss
    include-in-header: _partials/head.html
    include-before-body: _partials/nav.html
    include-after-body: _partials/footer.html
    grid:
      body-width: 760px   # prose width on standard pages (e.g. hub)
    toc: false
    anchor-sections: false
    smooth-scroll: false
    link-external-newwindow: true

execute:
  freeze: true

engine: knitr
lang: en
